<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstrumCare — Crew Authentication</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <div id="starfield" class="starfield" aria-hidden="true"></div>
  <div class="nebula-glow" aria-hidden="true"></div>

  <header class="top-nav">
    <a href="login.html" class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L14.8 8.8L22 9.5L16.5 14.2L18.2 21.2L12 17.4L5.8 21.2L7.5 14.2L2 9.5L9.2 8.8L12 2Z" />
        </svg>
      </div>
      <span>AstrumCare</span>
    </a>
    <nav class="nav-links" aria-label="Authentication Status">
      <span class="mission-badge" style="margin-bottom: 0;">
        <span class="pulse-dot"></span> SECURE TELEMETRY GATEWAY
      </span>
    </nav>
  </header>

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginHeading">
      <div class="mission-badge">
        <span class="pulse-dot"></span> CREW ACCESS REQUIRED
      </div>
      <h1 id="loginHeading" class="page-title" style="font-size: 1.9rem;">Mission Sign In</h1>
      <p class="page-subtitle" style="margin-bottom: 1.5rem;">
        Authenticate with your assigned crew or flight director credentials to access medical telemetry and longitudinal health logs.
      </p>

      <div id="loginErrorNotice" class="inline-notice" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="login-username">Crew Username</label>
          <input type="text" id="login-username" placeholder="Enter username" autocomplete="username" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.35rem;">
          <label for="login-password">Access Passcode</label>
          <input type="password" id="login-password" placeholder="Enter passcode" autocomplete="current-password" required />
        </div>

        <button type="submit" class="cta-btn" style="width: 100%; justify-content: center;">
          Authorize &amp; Enter Mission Hub
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
